name: Publish

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # Node 24.5+ bundles npm >= 11.5.1, the minimum for trusted publishing
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check if version is already published
        id: version
        run: |
          set -euo pipefail
          PKG_NAME=$(node -p "require('./package.json').name")
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          echo "Local version: ${PKG_NAME}@${LOCAL_VERSION}"
          if npm view "${PKG_NAME}@${LOCAL_VERSION}" version > /dev/null 2>&1; then
            echo "Version ${LOCAL_VERSION} already exists on the registry, skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${LOCAL_VERSION} is new, publishing"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish
